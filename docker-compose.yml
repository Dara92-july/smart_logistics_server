version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smart-logistics-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: smart_logistics
      MYSQL_USER: logistics
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smart-logistics-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smart-logistics-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      -       DATABASE_URL=mysql://logistics:${DB_PASSWORD:-changeme}@mysql:3306/smart_logistics
      - CLIENT_URL=http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smart-logistics-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smart-logistics-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - smart-logistics-network

volumes:
  mysql_data:

networks:
  smart-logistics-network:
    driver: bridge
